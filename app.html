    <!-- Gallery sidebar -->
    <aside id="template-panel" class="template-panel" aria-hidden="true">
        <header class="panel-header">
            <h2 class="panel-title">Gallery</h2>
            <button id="panel-close" class="panel-close" title="Close">&times;</button>
        </header>
        <div class="panel-toolbar">
            <input id="template-search" class="panel-search" type="search"
                   placeholder="Search drawings" autocomplete="off" spellcheck="false">
            <button id="btn-import-json" class="panel-action-btn" title="Import drawings from a JSON file">Import JSON</button>
        </div>
        <div class="tab-content">
            <div id="tab-gallery" class="template-grid"></div>
        </div>
    </aside>

    <!-- Modal -->
    <div id="app-modal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true">
            <header class="modal-header">

    </div>
