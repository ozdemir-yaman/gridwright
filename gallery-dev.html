<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridwright &mdash; Developer's Gallery</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="landing.css">
    <link rel="stylesheet" href="app-modal.css">
    <link rel="stylesheet" href="action-menu.css">
</head>
<body>
    <div class="page">
        <a class="back-link" href="index.html">&#8592; Back to home</a>

        <header class="hero">
            <h1 class="hero-title">Developer's Gallery</h1>
            <p class="hero-tagline">Examples built to demo Gridwright's features.</p>
        </header>

        <main class="gallery-grid" data-gallery-grid></main>
    </div>

    <!-- App modal (used by src/modal.js and the shared export dialog) -->
    <div id="app-modal" class="modal-backdrop" hidden>
        <div class="modal-card" role="dialog" aria-modal="true">
            <header class="modal-header">
                <h3 id="modal-title" class="modal-title"></h3>
            </header>
            <div class="modal-body">
                <p id="modal-message" class="modal-message"></p>
                <div id="modal-content" class="modal-content" hidden></div>
                <input id="modal-input" class="modal-input" type="text" hidden>
            </div>
            <footer class="modal-footer">
                <button id="modal-cancel" class="modal-btn modal-btn-secondary">Cancel</button>
                <button id="modal-confirm" class="modal-btn modal-btn-primary">OK</button>
            </footer>
        </div>
    </div>

    <script type="module" src="src/gallery-dev.js"></script>
</body>
</html>
