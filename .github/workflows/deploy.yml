# Build the site with Vite and deploy it to GitHub Pages.
#
# How it works
# ------------
# Every push to `main` triggers a build. The `configure-pages` action
# figures out the correct base path from your Pages settings automatically:
#   • Project site (owner/repo)         -> /repo/
#   • User site (owner/owner.github.io) -> /
#   • Custom domain                     -> /
# It exposes the base as `steps.pages.outputs.base_path`, which we pass
# to Vite through BASE_PATH so asset URLs resolve on any of those layouts.
#
# One-time setup on GitHub
# ------------------------
# 1. Push this repo to GitHub.
# 2. Repo -> Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# 3. Push a commit to `main`. Watch the run in the Actions tab.
# 4. The site becomes available at the URL printed by the deploy step.

name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    workflow_dispatch:

# Prevent concurrent deploys stepping on each other. In-flight runs
# for the same ref are cancelled when a new push arrives.
concurrency:
    group: pages
    cancel-in-progress: true

# Least-privilege permissions: read source, write to Pages, mint OIDC tokens.
permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Configure Pages
              id: pages
              uses: actions/configure-pages@v5

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Build
              env:
                  # `steps.pages.outputs.base_path` is the correct base for
                  # this Pages deployment (`/repo/` for project sites, `/`
                  # for user sites and custom domains).
                  BASE_PATH: ${{ steps.pages.outputs.base_path }}
              run: npm run build

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
